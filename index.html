<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chanmi - Nhà Thờ Công Giáo Trực Tuyến 3D</title>
    <!-- Thư viện Three.js 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- MODAL ĐĂNG NHẬP BAN ĐẦU -->
    <div id="joinModal" class="modal-overlay">
        <div class="modal-card">
            <h2>🇻🇳 Chanmi - Nhà Thờ Trực Tuyến</h2>
            <p>Không gian cầu nguyện và hiệp thông Công giáo 3D</p>
            <div class="input-group">
                <label>Tên Thánh + Họ Tên của bạn:</label>
                <input type="text" id="inputName" placeholder="Ví dụ: Maria Nguyễn Thị B" autocomplete="off">
            </div>
            <div class="input-group">
                <label>Bậc Sống / Vai Trò:</label>
                <select id="selectRole">
                    <option value="Giáo dân">🕯️ Giáo dân</option>
                    <option value="Linh mục">✝️ Linh mục</option>
                    <option value="Tu sĩ">🚺 Tu sĩ</option>
                </select>
            </div>
            <button class="btn-primary" onclick="joinRoom()">Vào Không Gian Cầu Nguyện</button>
        </div>
    </div>

    <!-- GIAO DIỆN CHÍNH -->
    <div id="appContainer">
        <!-- TOP BAR: THÔNG TIN PHÒNG & LỜI CHÚA -->
        <header class="church-header">
            <div class="room-badge">⛪ Chanmi 01 <span id="onlineCount">(01 người)</span></div>
            <div class="scripture-box">
                <span id="scriptureText">📖 "Thầy ở cùng anh em mọi ngày cho đến tận thế." (Mt 28,20)</span>
            </div>
            <div class="header-controls">
                <button id="audioToggleBtn" onclick="toggleAudio()" class="icon-btn">🎵</button>
                <button onclick="leaveRoom()" class="icon-btn">🚪</button>
            </div>
        </header>

        <!-- VÙNG HIỂN THỊ 3D CANVAS & GIAO DIỆN TƯƠNG TÁC GIỮA MÀN HÌNH -->
        <div id="canvasContainer">
            <!-- BẢNG TƯƠNG TÁC LẦN CHUỖI MÂN CÔI 3D (Giống Sansa) -->
            <div id="rosaryOverlay" class="rosary-3d-panel" style="display: none;">
                <div class="rosary-title">📿 Chuỗi Hạt Mân Côi Trực Tuyến</div>
                <div class="rosary-chain-view" id="rosaryChainContainer">
                    <!-- Các hạt chuỗi được sinh động hóa bằng JS -->
                </div>
                <div class="rosary-counter-info">
                    <span id="rosaryCurrentCount">0</span> / 10 Kinh Kính Mừng
                </div>
                <div class="rosary-actions">
                    <button class="btn-sub" onclick="previousBead()">⬅ Kinh trước</button>
                    <button class="btn-main" onclick="nextBead()">Đọc & Qua Hạt ➡</button>
                </div>
            </div>
        </div>

        <!-- BOTTOM NAV BAR: THANH ĐIỀU HƯỚNG TÂM LINH (Giống Sansa / Thali) -->
        <nav class="bottom-nav">
            <button class="nav-btn" onclick="triggerAction('🙏 Đang chầu Thánh Thể', 'thanh-the')">
                <span class="icon">✝️</span>
                <span class="label">Chầu Thánh Thể</span>
            </button>
            <button class="nav-btn" onclick="openRosaryPanel()">
                <span class="icon">📿</span>
                <span class="label">Lần Chuỗi</span>
            </button>
            <button class="nav-btn" onclick="triggerAction('🕯️ Đang thắp nến', 'duc-me')">
                <span class="icon">🕯️</span>
                <span class="label">Thắp Nến</span>
            </button>
            <button class="nav-btn" onclick="openPrayerModal()">
                <span class="icon">📖</span>
                <span class="label">Sổ Ý Nguyện</span>
            </button>
        </nav>
    </div>

    <!-- MODAL GHI SỔ Ý NGUYỆN -->
    <div id="prayerModal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <h3>📖 Sổ Tay Ý Nguyện Chanmi</h3>
            <p>Gửi gắm lời nguyện xin của bạn lên bàn thờ Chúa.</p>
            <textarea id="inputPrayerText" rows="4" placeholder="Nhập ý nguyện của bạn..."></textarea>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closePrayerModal()">Hủy</button>
                <button class="btn-primary" onclick="submitPrayer()">Gửi Ý Nguyện</button>
            </div>
        </div>
    </div>

    <audio id="bgAudio" loop>
        <source src="https://www.bensound.com/bensound-music/bensound-meditation.mp3" type="audio/mpeg">
    </audio>

    <script type="module" src="script.js"></script>
</body>
</html>
